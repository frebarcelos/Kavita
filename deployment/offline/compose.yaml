name: kavita-offline-f1
services:
  kavita:
    image: ${KAVITA_IMAGE:-jvmilazz0/kavita:0.9.1@sha256:31181a32f0dda73cae68721867028a7253d57881b58bea5754cd9e578e75421a}
    init: true
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "${KAVITA_BIND_ADDRESS:-127.0.0.1}:${KAVITA_PORT:-5000}:5000"
    volumes:
      - type: bind
        source: ${KAVITA_LIBRARY_PATH:?Defina KAVITA_LIBRARY_PATH com uma pasta existente}
        target: /media
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: config
        target: /kavita/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 5
volumes:
  config:
